Use official source metadata and honest uncertainty. Do not invent demand, endorsements, financial amounts, eligibility or source verification. All examples must be labelled; pricing is subject to commercial/legal review.
No public deployment, real customer records, payment activation, credentials, expenses or government submissions. Default to the documented synthetic development mode.
Write meaningful rendering/interaction tests and a runnable handoff. Work in an isolated scope/worktree or coordinator-authorized staging area; request required permissions rather than bypassing them. Coordinator integrates and opens review PRs; never merge.
"""
