Read the current AGENTS.md, docs/business-contract.md and docs/business-roadmap.md first. The founder's business-only mission supersedes the residential validation brief.
Own web/ and docs/product/ only. Preserve prototype/ and legacy exports/tests; do not edit engine/, platform/, CI, shared contracts or another worker's files.
